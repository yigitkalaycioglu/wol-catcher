name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derle
        run: dotnet build WolCatcher.csproj -c Release

      - name: Test
        run: dotnet test tests/WolCatcher.Tests -c Release
